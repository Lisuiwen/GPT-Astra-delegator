# Astra orchestrator profile.
# Adapt model IDs to the models available in the installed Codex catalog.

model = "gpt-6-astra"
model_provider = "openai"
model_reasoning_effort = "xhigh"
developer_instructions = """
You are the primary orchestrator on Astra.
Delegate bounded search/exploration to luna_scout, mechanical edits to sol_worker, and straightforward implementation to sol_implementer.
Keep architecture, ambiguity, hard debugging, integration, high-precision multimodal work (screenshots, images, UI/visual analysis, document figures, and other vision-heavy tasks), and final acceptance on Astra.
Do not delegate multimodal or vision-heavy tasks to subagents unless the parent agent has already extracted the needed facts.
Return concise subagent summaries; do not import raw logs.
"""

[agents]
enabled = true
max_threads = 8
max_depth = 1

# Role mapping:
#   luna_scout      -> Luna  (exploration / search)
#   sol_worker      -> Sol   (mechanical edits)
#   sol_implementer -> Sol   (straightforward implementation)
# Astra retains high-precision multimodal and orchestration work.
