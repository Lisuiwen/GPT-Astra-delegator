# GPT-6 orchestrator profile template
# Adapt this file to the installed Codex version before use.

model = "gpt-6-astra"
model_provider = "openai"
model_reasoning_effort = "medium"
model_instructions_file = "instructions/gpt6-delegation.md"

[agents]
enabled = true
max_threads = 8
max_depth = 1

# Do not pin worker models to a specific generation here.
# During setup, map the roles below to the newest compatible models
# actually available in the user's Codex environment:
#   Luna  -> exploration / search
#   Terra -> mechanical edits / routine execution
#   Sol   -> straightforward implementation
# Prefer the latest suitable family member rather than a hard-coded 5.x model id.
