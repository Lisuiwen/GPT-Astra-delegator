# GPT-6 orchestrator profile template
# Adapt this file to the installed Codex version before use.

model = "gpt-6-astra"
model_provider = "openai"
model_reasoning_effort = "medium"
model_instructions_file = "instructions/gpt6-delegation.md"

[agents]
enabled = true
max_threads = 8
max_depth = 1
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "medium"
